<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#243C8F" />
    <meta name="description" content="genAi TMS - quản lý chấm công và thời gian làm việc theo tiêu chuẩn UI/UX của genAi." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="genAi" />
    <link rel="manifest" href="/manifest.json" />
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/genai-symbol.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/genai-app-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <!--
      Both font requests belong in the document rather than behind an @import in
      style.css. An @import is only discovered once the bundled stylesheet has
      downloaded and parsed, which pushes the font two round trips later than it
      needs to be; a link here starts it while the CSS is still in flight.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      The app only ever renders this icon font at one fixed point (opsz 24, wght 400,
      GRAD 0) with two FILL states (0 = outlined, 1 = filled — see style.css). Requesting
      those two exact instances instead of the full variable axis range (opsz 20..48,
      wght 300..700, FILL 0..1, GRAD -50..200) cuts the font payload substantially, since
      every icon everywhere uses one of these two combinations.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0;24,400,1,0&display=block"
      rel="stylesheet"
    />
    <title>genAi TMS</title>
  </head>
  <body class="app-body select-none h-screen w-screen overflow-hidden font-sans antialiased">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
