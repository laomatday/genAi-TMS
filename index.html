<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#243C8F" />
    <meta name="description" content="genAi TMS - quản lý chấm công và thời gian làm việc theo tiêu chuẩn UI/UX của genAi." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="genAi" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem('genai_theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', savedTheme === 'dark' || (!savedTheme && systemDark));
        } catch (error) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/genai-symbol.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/genai-app-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <title>genAi TMS</title>
  </head>
  <body class="bg-slate-50 dark:bg-dark-bg text-slate-600 dark:text-dark-text-secondary select-none h-screen w-screen overflow-hidden font-sans antialiased transition-colors duration-300">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
