name: Commercial release gates
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: commercial-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check:release

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Start a clean local Supabase database
        run: bunx supabase@2.117.0 db start
      - name: Verify tenant configuration isolation
        run: docker exec -i supabase_db_genai-tms psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/tenant_configuration_isolation.sql
      - name: Run database lint and advisors
        run: |
          bunx supabase@2.117.0 db lint --local --schema public --level warning --fail-on error
          bunx supabase@2.117.0 db advisors --local --type all --level warn --fail-on error
      - name: Stop local Supabase
        if: always()
        run: bunx supabase@2.117.0 stop --no-backup
